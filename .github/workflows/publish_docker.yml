name: Publish Docker Image

on:
  workflow_call:
    inputs:
      tag_name:
        description: Version tag for the image (ex. v2.1.0)
        required: true
        type: string
      ref:
        description: Exact commit containing the release version
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-image:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          # Use the checked-out release commit, not the workflow's original Git context.
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ inputs.tag_name }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.tag_name }}
            org.opencontainers.image.revision=${{ inputs.ref }}
            org.opencontainers.image.licenses=MIT
