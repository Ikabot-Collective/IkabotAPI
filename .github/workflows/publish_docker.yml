name: Publish Docker Image

on:
  workflow_call:
    inputs:
      tag_name:
        description: Version tag for the image (ex. v2.1.0)
        required: true
        type: string
      ref:
        description: Exact commit containing the release version
        required: true
        type: string
      image_checksum:
        description: SHA-256 checksum of the validated image archive
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  push-image:
    name: Publish Validated Image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download validated image
        uses: actions/download-artifact@v4
        with:
          name: ReleaseImage
          path: ${{ runner.temp }}

      - name: Load and verify validated image
        shell: bash
        env:
          EXPECTED_CHECKSUM: ${{ inputs.image_checksum }}
          RELEASE_SHA: ${{ inputs.ref }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          printf '%s  %s\n' "$EXPECTED_CHECKSUM" "$RUNNER_TEMP/release-image.tar" | sha256sum --check
          docker load --input "$RUNNER_TEMP/release-image.tar"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' ikabot-api:check)" = "$RELEASE_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' ikabot-api:check)" = "$RELEASE_TAG"

      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push validated image
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          docker tag ikabot-api:check "$IMAGE_NAME:$RELEASE_TAG"
          docker tag ikabot-api:check "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:$RELEASE_TAG"
          docker push "$IMAGE_NAME:latest"
