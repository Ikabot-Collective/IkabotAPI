name: Publish Release

on:
  workflow_dispatch:
    inputs:
      milestone:
        description: 'Milestone title / version to release (ex: 2.1.0, without v)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}

defaults:
  run:
    shell: bash

jobs:
  update_version_number:
    name: Validate Release and Push Version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: read
    outputs:
      commit_sha: ${{ steps.commit.outputs.sha }}
      milestone_number: ${{ steps.milestone.outputs.number }}
      image_checksum: ${{ steps.image.outputs.checksum }}
    steps:
      - name: Validate release input
        env:
          VERSION: ${{ inputs.milestone }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Releases must be run from main."
            exit 1
          fi
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Use a stable version such as 2.1.0, without the v prefix."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Find milestone and check tag
        id: milestone
        env:
          VERSION: ${{ inputs.milestone }}
        run: |
          milestones=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/milestones?state=open&per_page=100")
          number=$(jq -er --arg title "$VERSION" \
            '[.[][] | select(.title == $title)] | if length == 1 then .[0].number else error("Expected one open milestone matching the version") end' \
            <<< "$milestones")
          if git show-ref --verify --quiet "refs/tags/v$VERSION"; then
            echo "::error::The release tag already exists."
            exit 1
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Replace version values
        env:
          VERSION: ${{ inputs.milestone }}
        run: python3 .github/scripts/bump_version.py "$VERSION"

      - name: Commit version update locally
        id: commit
        env:
          VERSION: ${{ inputs.milestone }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add apps/__init__.py pyproject.toml
          if ! git diff --cached --quiet; then
            git commit -m "Bump Ikabot API version $VERSION"
          fi
          # Keep the commit local until its tests and Docker checks succeed.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Test release commit
        uses: ./.github/actions/run-tests

      - name: Build and check release image
        uses: ./.github/actions/check-docker
        with:
          ref: ${{ steps.commit.outputs.sha }}
          version: ${{ inputs.milestone }}

      - name: Save validated image
        id: image
        run: |
          docker save --output "$RUNNER_TEMP/release-image.tar" ikabot-api:check
          checksum=$(sha256sum "$RUNNER_TEMP/release-image.tar" | cut -d ' ' -f 1)
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

      - name: Upload validated image
        uses: actions/upload-artifact@v4
        with:
          name: ReleaseImage
          path: ${{ runner.temp }}/release-image.tar
          compression-level: 1
          retention-days: 7
          if-no-files-found: error
          overwrite: true

      - name: Push validated version commit
        # A concurrent main update must fail here instead of publishing untested code.
        run: git push origin HEAD:main

  build_release_notes:
    name: Generate Release Notes
    needs: update_version_number
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - name: Get Contributors
        id: get-contribs
        uses: Keboo/GitHubHelper@master
        with:
          milestone: ${{ inputs.milestone }}
          repository: ${{ github.event.repository.name }}
          repository-owner: ${{ github.repository_owner }}
          token: ${{ github.token }}

      - name: Generate Release Notes
        env:
          VERSION: ${{ inputs.milestone }}
          RELEASE_SHA: ${{ needs.update_version_number.outputs.commit_sha }}
          CONTRIBUTORS: ${{ steps.get-contribs.outputs.contributors }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="v$VERSION" -f target_commitish="$RELEASE_SHA" \
            -f configuration_file_path='.github/release.yml' \
            --jq '.body' > ReleaseNotes.md
          printf '\n%s\n' "$CONTRIBUTORS" >> ReleaseNotes.md
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '\n## Docker image\n\n```sh\ndocker pull %s:v%s\n```\n' "$image" "$VERSION" >> ReleaseNotes.md

      - name: Upload Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: ReleaseNotes
          path: ReleaseNotes.md

  publish_docker:
    name: Publish Docker Image
    needs: [update_version_number, build_release_notes]
    uses: ./.github/workflows/publish_docker.yml
    with:
      tag_name: v${{ inputs.milestone }}
      ref: ${{ needs.update_version_number.outputs.commit_sha }}
      image_checksum: ${{ needs.update_version_number.outputs.image_checksum }}
    permissions:
      contents: read
      packages: write

  create_release:
    name: Create Draft Release
    needs: [update_version_number, publish_docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Release Notes
        uses: actions/download-artifact@v4
        with:
          name: ReleaseNotes

      - name: Create Release
        env:
          VERSION: ${{ inputs.milestone }}
          RELEASE_SHA: ${{ needs.update_version_number.outputs.commit_sha }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" --draft --title "$VERSION" --notes-file ReleaseNotes.md

  publish_release:
    name: Publish Release
    needs: create_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish Release
        env:
          VERSION: ${{ inputs.milestone }}
        run: gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  close_milestone:
    name: Close Milestone
    needs: [update_version_number, publish_release]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close Milestone
        env:
          MILESTONE_NUMBER: ${{ needs.update_version_number.outputs.milestone_number }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/milestones/$MILESTONE_NUMBER" \
            -f state=closed --silent
