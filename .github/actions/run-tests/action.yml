name: Run Python tests
description: Install the project and run the same tests for pull requests and releases.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        version: latest
        virtualenvs-create: true
        virtualenvs-in-project: true
        installer-parallel: true

    - name: Load cached venv
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-py3.10-${{ hashFiles('**/poetry.lock') }}

    - name: Install Project Dependencies
      # Always refresh the installed project, including its release version.
      shell: bash
      run: poetry install --no-interaction

    - name: Install Playwright
      shell: bash
      run: poetry run playwright install --with-deps chromium

    - name: Run Tests
      shell: bash
      env:
        PLAYWRIGHT_HEADLESS: 'true'
        LOGS_WEBHOOK_URL: ''
      run: PYTHONPATH=. poetry run pytest tests
